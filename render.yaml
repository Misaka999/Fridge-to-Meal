services:
  - type: web
    name: fridge-to-meal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m scripts.render_data build
    startCommand: python -m scripts.render_data start
    healthCheckPath: /
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: PYTHONUNBUFFERED
        value: "1"
